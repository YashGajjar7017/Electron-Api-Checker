<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="API Checker - Modern API Testing and Management Desktop Application"
    />
    <title>API Checker</title>
    <script>
      (function() {
        var isResizeObserverError = function(msg) {
          return msg && (
            msg === 'ResizeObserver loop completed with undelivered notifications' ||
            msg === 'ResizeObserver loop limit exceeded' ||
            msg.indexOf('ResizeObserver') >= 0
          );
        };
        
        window.addEventListener('error', function(e) {
          var msg = e.message || (e.error && e.error.message);
          if (isResizeObserverError(msg)) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
        
        window.addEventListener('unhandledrejection', function(e) {
          var msg = e.reason && (e.reason.message || e.reason);
          if (typeof msg === 'string' && isResizeObserverError(msg)) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
      })();
    </script>
    <style>
      html, body, #root {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background: #0f172a;
        color: #f1f5f9;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
